name: Perform Mixeway Scan

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  mixeway-scan:
    name: Mixeway Scanning
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Prepare variables
        id: vars
        shell: bash
        run: |
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT
          echo "sha_short=$(git rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Pull Mixeway docker image
        run: |
          docker pull mixeway/scanner:latest

      - name: Run Mixeway Scan
        run: |
          docker run \
            -e OSS_USERNAME="${{ secrets.OSS_USERNAME }}" \
            -e OSS_KEY="${{ secrets.OSS_KEY }}" \
            -e MIXEWAY_URL="${{ secrets.MIXEWAY_URL }}" \
            -e MIXEWAY_KEY="${{ secrets.MIXEWAY_KEY }}" \
            -e MIXEWAY_PROJECT_ID="${{ secrets.MIXEWAY_PROJECT_ID }}" \
            -e MODE=STANDALONE \
            -e MIXEWAY_PROJECT_NAME="${{ github.repository }}" \
            -e COMMIT_ID="${{ steps.vars.outputs.sha_short }}" \
            -e BRANCH="${{ steps.vars.outputs.branch }}" \
            -v ${{ github.workspace }}:/opt/sources \
            mixeway/scanner:latest

      - name: Display report
        run: |
          ls -lah
          cat mixeway_sast_report.json | jq .

      - name: Fail if vulnerabilities found
        run: |
          if [ ! -f mixeway_sast_report.json ]; then
            echo "mixeway_sast_report.json not found"
            exit 1
          fi

          VULNS=$(jq '[.[] | select(.severity == "Medium" or .severity == "High" or .severity == "Critical")] | length' mixeway_sast_report.json)

          echo "Detected Medium/High/Critical vulnerabilities: $VULNS"

          if [ "$VULNS" -gt 0 ]; then
            echo "Security vulnerabilities detected - failing pipeline"
            exit 1
          fi

          echo "No Medium/High/Critical vulnerabilities found"
